{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option Relations</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        .updated {
            background-color: #ffffcc;
            transition: background-color 1s;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #0066cc;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <a href="{% url 'groups' %}" class="back-link">← Back to Groups</a>
    <h1>Option Relations</h1>
    <div id="lastSync">Last sync: <span id="lastSyncTime">Never</span></div>
    <div style="margin-bottom: 20px;">
        <button onclick="syncClient.sync(true)" style="margin-right: 10px;">Force Sync</button>
    </div>
    <table id="relationsTable">
        <thead>
            <tr>
                <th>From Option</th>
                <th>To Option</th>
                <th>Relation Type</th>
                <th>Last Updated</th>
            </tr>
        </thead>
        <tbody id="relationsTableBody">
        </tbody>
    </table>

    <script src="{% static 'optionsexample/js/db.js' %}"></script>
    <script src="{% static 'optionsexample/js/sync.js' %}"></script>
    <script>
        // Initialize the sync client and load data
        async function initializeAndLoad() {
            await syncClient.initialize();
            await updateTable();
            
            // Set up sync event listener
            window.addEventListener('sync-option-updated', updateTable);
            
            // Start initial sync
            syncClient.sync();
        }

        async function updateTable() {
            const relations = await syncClient.getGroupRelations();
            const tbody = document.getElementById('relationsTableBody');
            tbody.innerHTML = '';

            relations.forEach(relation => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${relation.from_option}</td>
                    <td>${relation.to_option}</td>
                    <td>${relation.relation_type}</td>
                    <td>${new Date(relation.sync_id).toLocaleString()}</td>
                `;
                tbody.appendChild(row);
            });

            // Update last sync time
            document.getElementById('lastSyncTime').textContent = new Date().toLocaleString();
        }

        // Start everything
        initializeAndLoad();
    </script>
</body>
</html>
