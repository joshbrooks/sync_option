{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option Relations</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        .updated {
            background-color: #ffffcc;
            transition: background-color 1s;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #0066cc;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <a href="{% url 'groups' %}" class="back-link">← Back to Groups</a>
    <h1>Option Relations</h1>
    <div id="lastSync">Last sync: <span id="lastSyncTime">Never</span></div>
    <table id="relationsTable">
        <thead>
            <tr>
                <th>From Option</th>
                <th>To Option</th>
                <th>Relation Type</th>
                <th>Last Updated</th>
            </tr>
        </thead>
        <tbody id="relationsTableBody">
        </tbody>
    </table>

    <script>
        const RELATIONS_API_URL = "{% url 'api-1.0.0:get_relations' %}";
    </script>
    <script src="{% static 'optionsexample/js/db.js' %}"></script>
    <script src="{% static 'optionsexample/js/relations.js' %}"></script>
</body>
</html>
