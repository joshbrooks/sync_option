[project]
name = "sync-option"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Josh Brooks", email = "josh.vdbroek@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "django-ninja>=1.4.1",
]

[project.scripts]
sync-option = "sync_option:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "django>=5.2",
    "factory-boy>=3.3.3",
    "pytest-cov>=6.1.1",
    "pytest-django>=4.11.1",
]
playwright = [
    "playwright>=1.51.0",
]
